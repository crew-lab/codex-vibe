name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.19.0'
            other: '24.21.0'
          - node: '24.21.0'
            other: '20.19.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.other }}
      - run: echo "VIBE_SUPERVISOR_TEST_OTHER_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:release
