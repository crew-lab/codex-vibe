name: Release
on:
  push:
    tags:
      - 'v*'
permissions: {}
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19'
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not equal v$version from package.json." >&2
            exit 1
          fi
      - name: Install dependencies into a job-local npm cache
        run: npm ci --cache "$RUNNER_TEMP/npm-cache"
      - name: Warm the registry metadata the offline smoke install needs
        run: |
          mkdir -p "$RUNNER_TEMP/warm"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/warm"
          npm install --cache "$RUNNER_TEMP/npm-cache" --ignore-scripts --prefix "$RUNNER_TEMP/warm/prefix" "$RUNNER_TEMP"/warm/vibe-supervisor-*.tgz
      - name: Verify and package
        run: VIBE_SUPERVISOR_TEST_NPM_CACHE="$RUNNER_TEMP/npm-cache" npm run package:rc
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS release/sbom.spdx.json release/acceptance.json --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $flags
