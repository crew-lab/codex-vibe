version = 1
allowed_workspace_roots = []

[retention]
days = 7

[limits]
review_timeout_seconds = 1800
edit_timeout_seconds = 2400
max_turns_review = 20
max_turns_edit = 20
max_event_bytes = 52428800
max_transcript_bytes = 10485760
max_artifact_bytes = 104857600
worker_progress_timeout_seconds = 600
max_mcp_result_chars = 8000

# Optional: use an absolute executable path or a bare command name resolved via PATH.
# [paths]
# vibe = "/absolute/path/to/vibe"
