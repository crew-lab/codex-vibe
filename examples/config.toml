version = 1
allowed_workspace_roots = []

# Optional execution backend: "app-server" (default, Mistral Vibe). "antigravity"
# (Google Antigravity CLI) is experimental and also needs [experimental] antigravity = true.
# backend = "app-server"

# Optional: workspace-relative globs that no run under a root may read or write,
# added to the fixed reserved and secret patterns. Each key must equal an entry of
# allowed_workspace_roots as written. One segment (`*.tfvars`) matches at any depth;
# several segments (`fixtures/private/**`) are anchored at the workspace root.
# [excluded_globs]
# "~/src/project" = ["*.tfvars", "fixtures/private/**", "dumps/*.sql"]

# Optional: daily spending ceilings per allowed root, rolling 24 hours.
# Each key must equal an entry of allowed_workspace_roots as written.
# [budgets."~/src/project"]
# max_cost_usd_per_day = 50.0

[limits]
# Omitted limits keep their built-in defaults (docs/reference.md), which a copied
# value would freeze. Optional budgets enforced by the supervisor from Vibe's usage statistics.
# max_tokens = 2000000
# max_cost_usd = 5.0

[paths]
# Required for app-server backend: the manifest written on the machine that runs Vibe by
# `vibe-supervisor pin-manifest`.
vibe_pin_manifest = "/absolute/path/to/vibe-pin-manifest.json"
# Optional: use an absolute executable path or a bare command name resolved via PATH.
# vibe = "/absolute/path/to/vibe"
# app_server = "/absolute/path/to/vibe-app-server"
# antigravity = "/absolute/path/to/agy"
