version = 1
backend = "programmatic"
allowed_workspace_roots = ["/absolute/path/to/a/workspace"]
max_concurrent_runs = 2
max_queued_runs = 8
worker_idle_ttl_seconds = 600

[retention]
days = 7
preserve_failed_runs = true

[limits]
review_timeout_seconds = 1800
edit_timeout_seconds = 2400
max_turns_review = 12
max_turns_edit = 20
max_event_bytes = 52428800
max_transcript_bytes = 10485760
max_artifact_bytes = 104857600
max_mcp_result_chars = 8000
mcp_result_format = "text"
