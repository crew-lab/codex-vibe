version = 1
allowed_workspace_roots = []

# Optional: workspace-relative globs that no run under a root may read or write,
# added to the fixed reserved and secret patterns. Each key must equal an entry of
# allowed_workspace_roots as written. One segment (`*.tfvars`) matches at any depth;
# several segments (`fixtures/private/**`) are anchored at the workspace root.
# [excluded_globs]
# "~/src/project" = ["*.tfvars", "fixtures/private/**", "dumps/*.sql"]

[retention]
days = 7

[limits]
review_timeout_seconds = 1800
edit_timeout_seconds = 2400
max_turns_review = 20
max_turns_edit = 20
max_event_bytes = 52428800
max_transcript_bytes = 10485760
max_artifact_bytes = 104857600
worker_progress_timeout_seconds = 600
max_mcp_result_chars = 8000
# Optional budgets enforced by the supervisor from Vibe's usage statistics.
# max_tokens = 2000000
# max_cost_usd = 5.0

[paths]
# Required: the manifest written on the machine that runs Vibe by
# `vibe-supervisor pin-manifest`.
vibe_pin_manifest = "/absolute/path/to/vibe-pin-manifest.json"
# Optional: use an absolute executable path or a bare command name resolved via PATH.
# vibe = "/absolute/path/to/vibe"
# app_server = "/absolute/path/to/vibe-app-server"
